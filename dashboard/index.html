<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRYPTOagent Terminal</title>
<style>
  /* ------------------------------------------------------------------
     Two typefaces, on purpose. Times New Roman is the DISPLAY face -
     brand, headings, prose - which is where the editorial weight of a
     financial paper comes from. The dense numeric grid uses a tabular
     system face, because a serif at 12px in a 14-column table is where
     legibility goes to die. Numbers are the product; they get the font
     that renders them cleanly.

     Colour: a gold-led categorical palette was tested and FAILED
     validation (gold L=0.728 outside band; red/green dE 6.6 deuteranopia),
     so gold carries chrome only. Data hues are validated dark steps:
     CVD dE 8.4, normal-vision 19.8, all >=3:1 on the #16131b surface.
     ------------------------------------------------------------------ */
  :root{
    --plane:#0c0a0f; --surface:#16131b; --surface-2:#1d1925; --surface-3:#262030;
    --gold:#c9a227; --gold-dim:#8a7020; --gold-wash:rgba(201,162,39,.09);
    --ink:#f2ede4; --ink-2:#b6afa4; --muted:#7e766d;
    --grid:#262130; --hairline:rgba(201,162,39,.16); --rule:#2f2839;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --up:#0ca30c; --down:#d03b3b; --warn:#fab219;
    --serif:"Times New Roman",Times,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --ui:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{background:var(--plane);color:var(--ink);margin:0}
  body{font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
  .serif{font-family:var(--serif)}
  h1,h2,h3{margin:0;font-weight:400;font-family:var(--serif)}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:16px;height:46px;padding:0 16px;
    background:var(--surface);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:40}
  .brand{font-family:var(--serif);font-size:19px;letter-spacing:.17em;text-transform:uppercase;
    color:var(--gold);white-space:nowrap}
  .brand em{font-style:normal;color:var(--ink-2)}
  .tabs{display:flex;height:100%}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    font:inherit;font-size:12.5px;padding:0 13px;height:100%;cursor:pointer;letter-spacing:.04em}
  .tab:hover{color:var(--ink-2)}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
  select,button.ui{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule);
    font:inherit;font-size:12px;padding:4px 9px;cursor:pointer}
  select:hover,button.ui:hover{border-color:var(--gold-dim);color:var(--ink)}
  button.go{background:transparent;color:var(--gold);border:1px solid var(--gold-dim);
    font:inherit;font-size:12px;padding:4px 13px;cursor:pointer;letter-spacing:.06em}
  button.go:hover:not(:disabled){background:var(--gold-wash)}
  button.go:disabled{opacity:.4;cursor:default}
  .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .pulse.on{background:var(--up);animation:beat 2s ease-in-out infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.4}}
  .clock{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}

  /* ---------- layer rail ---------- */
  .rail{display:flex;background:var(--surface);border-bottom:1px solid var(--rule);overflow-x:auto}
  .lay{flex:1;min-width:150px;padding:6px 14px;border-right:1px solid var(--rule);position:relative;white-space:nowrap}
  .lay:last-child{border-right:0}
  .lay .n{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim)}
  .lay .t{font-family:var(--serif);font-size:14px;line-height:1.2}
  .lay .v{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .lay .st{position:absolute;top:8px;right:10px;width:5px;height:5px;border-radius:50%}

  /* ---------- grid ---------- */
  .panes{display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .18s}
  .panes.open{grid-template-columns:minmax(0,1fr) 400px}
  @media(max-width:1250px){.panes.open{grid-template-columns:minmax(0,1fr) 340px}}
  .gridwrap{overflow:auto;max-height:calc(100vh - 46px - 46px - 26px)}
  table.g{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;
    font-variant-numeric:tabular-nums}
  table.g thead th{position:sticky;top:0;z-index:5;background:var(--surface);
    font-family:var(--ui);font-weight:500;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--gold-dim);padding:7px 9px;border-bottom:1px solid var(--hairline);
    white-space:nowrap;cursor:pointer;user-select:none}
  table.g thead th:hover{color:var(--gold)}
  table.g thead th .ar{opacity:.55;font-size:9px}
  table.g td{padding:5px 9px;border-bottom:1px solid var(--grid);white-space:nowrap}
  table.g tbody tr{cursor:pointer}
  table.g tbody tr:hover{background:var(--surface-2)}
  table.g tbody tr.sel{background:#1c2434;box-shadow:inset 2px 0 0 var(--gold)}
  .r{text-align:right} .l{text-align:left} .c{text-align:center}
  .sym{font-family:var(--serif);font-size:14px;color:var(--ink)}
  .nm{color:var(--muted);font-size:10px;font-family:var(--ui)}
  .up{color:var(--up)} .down{color:var(--down)} .zero{color:var(--muted)}
  /* the tick: a cell that just changed gets a brief wash, so movement is felt */
  @keyframes tickUp{0%{background:rgba(12,163,12,.32)}100%{background:transparent}}
  @keyframes tickDn{0%{background:rgba(208,59,59,.32)}100%{background:transparent}}
  td.tu{animation:tickUp 1.1s ease-out} td.td{animation:tickDn 1.1s ease-out}
  .pill{display:inline-block;padding:0 6px;font-size:10px;font-family:var(--ui);
    letter-spacing:.06em;text-transform:uppercase;border:1px solid}
  .STRONG,.long{color:var(--up);border-color:rgba(12,163,12,.45)}
  .WATCH{color:var(--warn);border-color:rgba(250,178,25,.4)}
  .NEUTRAL,.pass{color:var(--muted);border-color:var(--rule)}
  .AVOID,.avoid{color:var(--down);border-color:rgba(208,59,59,.45)}
  .mini{display:inline-block;width:46px;height:5px;background:var(--grid);vertical-align:middle}
  .mini i{display:block;height:100%}
  .aura{font-family:var(--serif);font-size:14px}
  .enduring{color:var(--up)} .holding{color:var(--s4)}
  .fading{color:var(--warn)} .spent{color:var(--muted)}

  /* ---------- side panel ---------- */
  .side{background:var(--surface);border-left:1px solid var(--hairline);overflow:auto;
    max-height:calc(100vh - 46px - 46px - 26px)}
  .side h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    font-family:var(--ui);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .side .pad{padding:14px 16px}
  .hero{display:flex;align-items:baseline;gap:12px}
  .hero .big{font-family:var(--serif);font-size:46px;line-height:1}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:12px}
  .kv div:nth-child(odd){color:var(--muted);font-family:var(--ui)}
  .kv div:nth-child(even){text-align:right}
  .why{border-left:2px solid var(--gold-dim);padding:6px 11px;margin:6px 0;font-size:12px;
    color:var(--ink-2);background:var(--surface-2)}
  ul{margin:0;padding-left:16px} li{margin:4px 0;font-size:12px;color:var(--ink-2)}

  /* ---------- status bar ---------- */
  .status{position:fixed;bottom:0;left:0;right:0;height:26px;background:var(--surface);
    border-top:1px solid var(--hairline);display:flex;align-items:center;gap:18px;padding:0 14px;
    font-family:var(--mono);font-size:11px;color:var(--muted);z-index:40}
  .status b{color:var(--ink-2);font-weight:400}

  /* ---------- column picker ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;
    align-items:center;justify-content:center}
  .sheet{background:var(--surface);border:1px solid var(--hairline);width:min(660px,92vw);
    max-height:80vh;overflow:auto}
  .sheet h2{font-size:15px;padding:14px 18px;border-bottom:1px solid var(--rule);color:var(--gold)}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px;padding:14px 18px}
  .cols label{display:flex;gap:8px;align-items:center;padding:5px 7px;cursor:pointer;font-size:12px}
  .cols label:hover{background:var(--surface-2)}
  .cols small{color:var(--muted);display:block;font-size:10.5px}
  .sheetfoot{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center}
  .empty{padding:50px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:15px}
  #tip{position:fixed;pointer-events:none;z-index:99;background:var(--surface-3);
    border:1px solid var(--hairline);padding:7px 11px;font-size:12px;max-width:290px;
    box-shadow:0 12px 34px rgba(0,0,0,.75);opacity:0;transition:opacity .1s}
  .note{padding:11px 16px;color:var(--muted);font-size:12px;line-height:1.65;border-bottom:1px solid var(--grid)}
  .note b{color:var(--ink-2);font-weight:400}
</style>
</head>
<body>
<div id="tip"></div>

<div class="top">
  <div class="brand">CRYPTO<em>agent</em></div>
  <div class="tabs">
    <button class="tab on" data-v="Radar">Radar</button>
    <button class="tab" data-v="Fc">Forecast</button>
    <button class="tab" data-v="Tg">Telegram</button>
    <button class="tab" data-v="Score">Scorecard</button>
    <button class="tab" data-v="Adapt">Adaptation</button>
  </div>
  <select id="tpl" title="Column template"></select>
  <button class="ui" id="cols">Columns</button>
  <div class="right">
    <label class="clock" style="cursor:pointer"><input type="checkbox" id="liveTick" checked> live 10s</label>
    <span class="pulse" id="pulse"></span>
    <span class="clock" id="clock">--:--:--</span>
    <button class="go" id="scan">Scan</button>
  </div>
</div>

<div class="rail" id="rail"></div>

<div class="panes" id="panes">
  <div class="gridwrap" id="gridwrap"><div class="empty">No scan yet.</div></div>
  <div class="side" id="side"></div>
</div>

<div class="status">
  <span>SCAN <b id="stScan">—</b></span>
  <span>TICK <b id="stTick">—</b></span>
  <span>ROWS <b id="stRows">0</b></span>
  <span>REGIME <b id="stRegime">—</b></span>
  <span id="stMsg"></span>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let STATE={tokens:[],ts:null}, SEL=null, MACRO=null, QUOTES={}, PREV={}, VIEW='Radar';
let SORT={key:'composite',dir:-1};

const nf=(n,d=2)=>n==null||!isFinite(n)?'—':(+n).toFixed(d);
const usd=n=>!n||!isFinite(n)?'—':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M'
  :n>=1e3?(n/1e3).toFixed(1)+'k':(+n).toFixed(n<0.01?6:2);
const pc=n=>n==null||!isFinite(n)?'—':(n>=0?'+':'')+(+n).toFixed(1)+'%';
const dirc=n=>n>0.15?'up':n<-0.15?'down':'zero';

const tip=$('#tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t){tip.style.opacity='0';return;}
  tip.innerHTML=t.dataset.tip; tip.style.opacity='1';
  let x=e.clientX+14,y=e.clientY+14; const b=tip.getBoundingClientRect();
  if(x+b.width>innerWidth-8)x=e.clientX-b.width-14;
  if(y+b.height>innerHeight-8)y=e.clientY-b.height-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-GB');},1000);

// live quote overlay: the tick endpoint re-prices what is on screen, so these
// win over the (older) scan snapshot wherever they exist
const q=(t,k,fb)=>{const v=QUOTES[t.feat.mint]; return v&&v[k]!=null?v[k]:fb;};
function miniBar(v,color){
  const w=Math.max(0,Math.min(100,v||0));
  return `<span class="mini"><i style="width:${w}%;background:${color}"></i></span>`;
}

/* =====================  COLUMN REGISTRY  =====================
   Every column is declared once: how to read it, how to format it, how wide,
   and whether it participates in the 10-second tick. Templates are just named
   lists of ids, so a new view is a one-line change rather than new markup. */
const COLUMNS={
  sym:{label:'Symbol',w:'l',sort:t=>t.feat.symbol||'',tip:'Ticker and name',
    cell:t=>`<div class="sym">${esc(t.feat.symbol||'?')}</div><div class="nm">${esc((t.feat.name||'').slice(0,20))}</div>`},
  composite:{label:'Score',w:'r',sort:t=>t.score.composite,tip:'Composite of all pillars, risk-discounted',
    cell:t=>`<b>${t.score.composite.toFixed(0)}</b>`},
  verdict:{label:'Verdict',w:'c',sort:t=>t.score.composite,tip:'Percentile verdict within this scan',
    cell:t=>`<span class="pill ${t.score.verdict}">${t.score.verdict}</span>`},
  aura:{label:'Aura',w:'r',sort:t=>t.aura?.points??-1,
    tip:'AURA POINTS — will this still be trending in 2-3 hours? Fuel, not ignition. Scored from candle structure.',
    cell:t=>t.aura?`<span class="aura ${t.aura.band}">${t.aura.points}</span>`:'<span class="zero">—</span>'},
  auraBand:{label:'Durability',w:'c',sort:t=>t.aura?.points??-1,tip:'Aura band',
    cell:t=>t.aura?`<span class="${t.aura.band}">${t.aura.band}</span>`:'—'},
  fomo:{label:'FOMO',w:'r',sort:t=>t.score.fomo??-1,tip:'Crowd ignition, macro-gated',
    cell:t=>t.score.fomo==null?'—':`${miniBar(t.score.fomo,'var(--s4)')} ${t.score.fomo.toFixed(0)}`},
  price:{label:'Price',w:'r',live:1,sort:t=>q(t,'price',t.feat.priceUsd),tip:'Live price (10s tick)',
    cell:t=>usd(q(t,'price',t.feat.priceUsd))},
  m5:{label:'5m',w:'r',live:1,sort:t=>q(t,'m5',t.feat.priceChange.m5),tip:'5-minute change (live)',
    cell:t=>{const v=q(t,'m5',t.feat.priceChange.m5);return `<span class="${dirc(v)}">${pc(v)}</span>`}},
  h1:{label:'1h',w:'r',live:1,sort:t=>q(t,'h1',t.feat.priceChange.h1),tip:'1-hour change (live)',
    cell:t=>{const v=q(t,'h1',t.feat.priceChange.h1);return `<span class="${dirc(v)}">${pc(v)}</span>`}},
  h6:{label:'6h',w:'r',live:1,sort:t=>q(t,'h6',t.feat.priceChange.h6),tip:'6-hour change (live)',
    cell:t=>{const v=q(t,'h6',t.feat.priceChange.h6);return `<span class="${dirc(v)}">${pc(v)}</span>`}},
  mcap:{label:'MCap',w:'r',live:1,sort:t=>q(t,'mcap',t.feat.mcap),tip:'Market cap (live)',
    cell:t=>usd(q(t,'mcap',t.feat.mcap))},
  liq:{label:'Liq',w:'r',live:1,sort:t=>q(t,'liq',t.feat.liqUsd),tip:'Pool liquidity (live)',
    cell:t=>usd(q(t,'liq',t.feat.liqUsd))},
  volH1:{label:'Vol 1h',w:'r',live:1,sort:t=>q(t,'volH1',t.feat.volume.h1),tip:'1-hour volume (live)',
    cell:t=>usd(q(t,'volH1',t.feat.volume.h1))},
  flow:{label:'Flow 5m',w:'r',live:1,tip:'Buy share of last 5m transactions (live)',
    sort:t=>{const v=QUOTES[t.feat.mint];return v?v.buys/((v.buys+v.sells)||1):t.feat.buyRatioH1},
    cell:t=>{const v=QUOTES[t.feat.mint];const r=v?v.buys/((v.buys+v.sells)||1):t.feat.buyRatioH1;
      return `<span class="${r>0.55?'up':r<0.45?'down':'zero'}">${(r*100).toFixed(0)}%</span>`}},
  att:{label:'Att',w:'r',sort:t=>t.score.attention,tip:'Attention pillar',
    cell:t=>`${miniBar(t.score.attention,'var(--s1)')} ${t.score.attention.toFixed(0)}`},
  mom:{label:'Mom',w:'r',sort:t=>t.score.momentum,tip:'Momentum pillar',
    cell:t=>`${miniBar(t.score.momentum,'var(--s2)')} ${t.score.momentum.toFixed(0)}`},
  liqh:{label:'LiqH',w:'r',sort:t=>t.score.liquidityHealth,tip:'Liquidity-health pillar',
    cell:t=>`${miniBar(t.score.liquidityHealth,'var(--s3)')} ${t.score.liquidityHealth.toFixed(0)}`},
  risk:{label:'Risk',w:'r',sort:t=>t.score.risk,tip:'Contract/rug risk — higher is worse',
    cell:t=>`<span class="${t.score.risk>50?'down':t.score.risk>30?'':'zero'}">${t.score.risk.toFixed(0)}</span>`},
  rvol:{label:'RVol/h',w:'r',sort:t=>t.feat.candles?.realised_vol_60m_pct??-1,
    tip:'REALISED hourly volatility, measured from candles — not estimated',
    cell:t=>t.feat.candles?nf(t.feat.candles.realised_vol_60m_pct,1)+'%':'—'},
  evol:{label:'E[move]',w:'r',sort:t=>t.prediction?.volatility.expected_move_p50??-1,
    tip:'Forecast typical absolute move over 60m',
    cell:t=>t.prediction?'&plusmn;'+t.prediction.volatility.expected_move_p50+'%':'—'},
  pup:{label:'P(up)',w:'r',sort:t=>t.prediction?.p_up??-1,tip:'Forecast probability of an up move',
    cell:t=>t.prediction?Math.round(t.prediction.p_up*100)+'%':'—'},
  call:{label:'Call',w:'c',sort:t=>t.prediction?.call==='long'?2:t.prediction?.call==='avoid'?0:1,
    tip:'Forecast call — the engine declines most of them on purpose',
    cell:t=>t.prediction?`<span class="pill ${t.prediction.call}">${t.prediction.call}</span>`:'—'},
  stab:{label:'Stab',w:'r',sort:t=>t.stability?.p_top5??-1,
    tip:'Share of 200 re-weightings where this stayed top-5. Low means the ranking is the weights talking.',
    cell:t=>{const v=t.stability?.p_top5;return v==null?'—':`<span class="${v>=0.5?'up':'warn'}" style="color:${v>=0.5?'var(--up)':'var(--warn)'}">${Math.round(v*100)}%</span>`}},
  hl:{label:'HiLo',w:'r',sort:t=>t.feat.candles?.higher_lows_ratio??-1,
    tip:'Share of candles making higher lows — absorption vs distribution',
    cell:t=>t.feat.candles?Math.round(t.feat.candles.higher_lows_ratio*100)+'%':'—'},
  dd:{label:'MaxDD',w:'r',sort:t=>-(t.feat.candles?.max_drawdown_pct??999),
    tip:'Deepest pullback inside the candle window',
    cell:t=>t.feat.candles?nf(t.feat.candles.max_drawdown_pct,1)+'%':'—'},
  age:{label:'Age',w:'r',sort:t=>t.feat.ageH,tip:'Pool age',
    cell:t=>t.feat.ageH<1?Math.round(t.feat.ageH*60)+'m':t.feat.ageH<48?t.feat.ageH.toFixed(1)+'h':(t.feat.ageH/24).toFixed(1)+'d'},
  phase:{label:'Phase',w:'l',sort:t=>t.advice.phase,tip:'Lifecycle phase heuristic',
    cell:t=>`<span class="nm" style="font-size:11px">${esc(t.advice.phase)}</span>`},
  sat:{label:'Sat',w:'r',sort:t=>t.feat.fomo?.saturation??-1,
    tip:'Attention saturation vs tier median. The FOMO curve peaks near 3x and dies past ~8x.',
    cell:t=>t.feat.fomo?nf(t.feat.fomo.saturation,1)+'x':'—'},
};
const TEMPLATES={
  'Overview':      ['sym','composite','verdict','aura','fomo','price','m5','h1','h6','mcap','liq','age'],
  'Momentum':      ['sym','composite','price','m5','h1','h6','volH1','flow','mom','sat','phase'],
  'Durability':    ['sym','aura','auraBand','hl','dd','rvol','h1','h6','volH1','age','phase'],
  'Forecast':      ['sym','composite','call','pup','evol','rvol','stab','aura','h1'],
  'Risk':          ['sym','composite','risk','liq','liqh','mcap','age','sat','phase'],
  'Everything':    Object.keys(COLUMNS),
};
const LS='cryptoagent.cols.v1';
let tplName=localStorage.getItem(LS+'.tpl')||'Overview';
let custom=JSON.parse(localStorage.getItem(LS)||'null');
const activeCols=()=>tplName==='Custom'&&custom?custom:(TEMPLATES[tplName]||TEMPLATES.Overview);

function initTpl(){
  const names=[...Object.keys(TEMPLATES),'Custom'];
  $('#tpl').innerHTML=names.map(n=>`<option ${n===tplName?'selected':''}>${n}</option>`).join('');
  $('#tpl').onchange=e=>{tplName=e.target.value;localStorage.setItem(LS+'.tpl',tplName);renderGrid();};
}
$('#cols').onclick=()=>{
  const sel=new Set(activeCols());
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h2 class="serif">Columns</h2><div class="cols">
    ${Object.entries(COLUMNS).map(([id,c])=>`<label><input type="checkbox" data-id="${id}" ${sel.has(id)?'checked':''}>
      <span>${c.label}${c.live?' <span style="color:var(--up)">&bull;</span>':''}<small>${esc((c.tip||'').slice(0,58))}</small></span></label>`).join('')}
    </div><div class="sheetfoot"><button class="go" id="applyCols">Apply as Custom</button>
    <button class="ui" id="closeCols">Cancel</button>
    <span class="nm" style="margin-left:auto">&bull; marks columns that update on the 10s tick</span></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#closeCols').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove();};
  m.querySelector('#applyCols').onclick=()=>{
    custom=[...m.querySelectorAll('input:checked')].map(i=>i.dataset.id);
    if(!custom.length)custom=['sym','composite'];
    localStorage.setItem(LS,JSON.stringify(custom));
    tplName='Custom';localStorage.setItem(LS+'.tpl',tplName);
    initTpl();renderGrid();m.remove();
  };
};

function renderGrid(){
  const cols=activeCols().filter(id=>COLUMNS[id]);
  const rows=[...(STATE.tokens||[])];
  const sc=COLUMNS[SORT.key];
  if(sc&&sc.sort) rows.sort((a,b)=>{const x=sc.sort(a),y=sc.sort(b);
    return (typeof x==='string'?x.localeCompare(y):x-y)*SORT.dir;});
  if(!rows.length){$('#gridwrap').innerHTML='<div class="empty">No scan yet.</div>';return;}
  $('#gridwrap').innerHTML=`<table class="g"><thead><tr>${cols.map(id=>{
    const c=COLUMNS[id];
    return `<th class="${c.w}" data-k="${id}" data-tip="${esc(c.tip||c.label)}">${c.label}${
      SORT.key===id?` <span class="ar">${SORT.dir>0?'▲':'▼'}</span>`:''}</th>`;}).join('')}</tr></thead>
    <tbody>${rows.map(t=>`<tr data-mint="${esc(t.feat.mint)}" class="${t.feat.mint===SEL?'sel':''}">
      ${cols.map(id=>`<td class="${COLUMNS[id].w}" data-col="${id}" data-mint="${esc(t.feat.mint)}">${COLUMNS[id].cell(t)}</td>`).join('')}
    </tr>`).join('')}</tbody></table>`;
  $('#gridwrap').querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    SORT = SORT.key===k?{key:k,dir:-SORT.dir}:{key:k,dir:-1};
    renderGrid();
  });
  $('#gridwrap').querySelectorAll('tr[data-mint]').forEach(tr=>tr.onclick=()=>select(tr.dataset.mint));
  $('#stRows').textContent=rows.length;
}

/* the 10-second tick: repaint ONLY live cells, and wash the ones that moved so
   a change is felt rather than merely displayed */
async function tick(){
  if(!$('#liveTick').checked) return;
  try{
    const r=await fetch('/api/tick').then(x=>x.json());
    if(!r||!r.quotes) return;
    PREV=QUOTES; QUOTES=r.quotes;
    $('#stTick').textContent=new Date(r.ts*1000).toLocaleTimeString('en-GB');
    const cols=activeCols().filter(id=>COLUMNS[id]&&COLUMNS[id].live);
    for(const t of STATE.tokens||[]){
      const now=QUOTES[t.feat.mint], was=PREV[t.feat.mint];
      if(!now) continue;
      for(const id of cols){
        const td=$(`td[data-col="${id}"][data-mint="${CSS.escape(t.feat.mint)}"]`);
        if(!td) continue;
        const html=COLUMNS[id].cell(t);
        if(td.innerHTML===html) continue;
        td.innerHTML=html;
        if(was){
          const dir=(now.price??0)-(was.price??0);
          td.classList.remove('tu','td');void td.offsetWidth;
          td.classList.add(dir>=0?'tu':'td');
        }
      }
    }
    if(SEL&&QUOTES[SEL]) paintSideLive();
  }catch{}
}
setInterval(tick,10000);

function paintSideLive(){
  const el=$('#sideLive'); if(!el) return;
  const v=QUOTES[SEL]; if(!v) return;
  el.innerHTML=`<div class="kv"><div>Price</div><div>$${usd(v.price)}</div>
    <div>5m</div><div class="${dirc(v.m5)}">${pc(v.m5)}</div>
    <div>1h</div><div class="${dirc(v.h1)}">${pc(v.h1)}</div>
    <div>Liquidity</div><div>$${usd(v.liq)}</div>
    <div>5m flow</div><div>${Math.round(v.buys/((v.buys+v.sells)||1)*100)}% buys</div></div>`;
}

function select(mint){
  SEL=mint; $('#panes').classList.add('open');
  renderGrid(); renderSide();
}

function renderSide(){
  const t=(STATE.tokens||[]).find(x=>x.feat.mint===SEL);
  if(!t){$('#side').innerHTML='';return;}
  const f=t.feat,s=t.score,a=t.advice,p=t.prediction,au=t.aura,fo=f.fomo;
  $('#side').innerHTML=`<div class="pad">
    <div class="hero"><div class="big">${s.composite.toFixed(0)}</div>
      <div><div class="sym" style="font-size:19px">${esc(f.symbol||'?')}</div>
      <div class="nm">${esc(f.name||'')} &middot; <a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--gold)">chart &#8599;</a></div></div>
      ${au?`<div style="margin-left:auto;text-align:right"><div class="aura ${au.band}" style="font-size:30px">${au.points}</div>
        <div class="nm">AURA &middot; ${au.band}</div></div>`:''}</div>

    <h3>Live</h3><div id="sideLive"><div class="nm">waiting for tick&hellip;</div></div>

    ${au?`<h3>Aura — next ${au.horizon_minutes/60} hours</h3>
      <div class="nm" style="margin-bottom:6px">Coverage ${au.coverage}% ${au.coverage<50?'(too thin to call)':''}</div>
      ${Object.entries(au.components).filter(([,v])=>v!=null).map(([k,v])=>
        `<div style="display:grid;grid-template-columns:104px 1fr 28px;gap:8px;align-items:center;margin:3px 0">
          <span class="nm">${k.replace(/([A-Z])/g,' $1')}</span>${miniBar(v,'var(--s4)')}
          <span style="font-family:var(--mono);font-size:11px;text-align:right">${v}</span></div>`).join('')}
      ${au.notes.map(n=>`<div class="why">${esc(n)}</div>`).join('')}`:''}

    ${p?`<h3>Forecast — 60m</h3><div class="why" style="border-color:var(--gold)">
      ${p.call==='pass'?'No read — declining to call this one.'
        :`${p.call==='long'?'Up':'Down'}. P(up) ${Math.round(p.p_up*100)}%, expected move &plusmn;${p.volatility.expected_move_p50}% (tail &plusmn;${p.volatility.expected_move_p90}%).`}</div>
      <ul>${(p.chain||[]).slice(0,4).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}

    ${fo?`<h3>Crowd</h3>${fo.macro?`<div class="why">${esc(fo.macro.note)}</div>`:''}
      ${fo.reasons.slice(0,3).map(r=>`<div class="why">${esc(r)}</div>`).join('')}`:''}

    <h3>${esc(a.phase)}</h3><div class="nm" style="line-height:1.6">${esc(a.phase_note)}</div>
    <h3>Risks</h3><ul>${(a.risks||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Invalidation</h3><ul>${(a.invalidation||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </div>`;
  paintSideLive();
}

const LAYERS=[['Layer 0','Macro'],['Layer 1','Cohort'],['Layer 2','Structure'],
              ['Layer 3','Crowd'],['Layer 4','Social'],['Layer 5','Forecast']];
function renderRail(){
  const t=STATE.tokens||[],fo=t[0]&&t[0].feat.fomo;
  const dir=t.filter(x=>x.prediction&&x.prediction.call!=='pass').length;
  const endur=t.filter(x=>x.aura&&x.aura.points>=65).length;
  const vals=[
    MACRO&&MACRO.available?`${MACRO.regime} ${(MACRO.lead_change_pct||0).toFixed(1)}%`:'no EODHD key',
    `${t.length} tokens`, `${t.filter(x=>x.score.risk<40).length} low risk`,
    fo?`${fo.regime} ${Math.round(fo.breadth*100)}% green`:'—',
    `${endur} enduring`, `${dir} directional`];
  const st=[MACRO&&MACRO.available?'var(--up)':'var(--muted)','var(--up)','var(--up)',
    fo?'var(--up)':'var(--muted)',endur?'var(--up)':'var(--warn)',dir?'var(--up)':'var(--warn)'];
  $('#rail').innerHTML=LAYERS.map((l,i)=>`<div class="lay"><span class="st" style="background:${st[i]}"></span>
    <div class="n">${l[0]}</div><div class="t">${l[1]}</div><div class="v">${vals[i]}</div></div>`).join('');
  $('#stRegime').textContent=MACRO&&MACRO.available?MACRO.regime:'n/a';
}

async function loadAll(){
  const [d,m,s]=await Promise.all([
    fetch('/api/tokens').then(r=>r.json()).catch(()=>null),
    fetch('/api/regime').then(r=>r.json()).catch(()=>null),
    fetch('/api/status').then(r=>r.json()).catch(()=>({}))]);
  if(d)STATE=d; MACRO=m;
  renderRail(); renderGrid(); if(SEL) renderSide();
  $('#stScan').textContent=STATE.ts?new Date(STATE.ts*1000).toLocaleTimeString('en-GB'):'—';
  $('#stMsg').innerHTML=s.lastError?`<span style="color:var(--down)">${esc(s.lastError)}</span>`:'';
  $('#scan').disabled=!!s.running;
  tick();
}

function connect(){
  const es=new EventSource('/api/stream');
  es.addEventListener('hello',()=>$('#pulse').classList.add('on'));
  es.addEventListener('beat',e=>{try{$('#scan').disabled=!!JSON.parse(e.data).running}catch{}});
  es.addEventListener('scan',()=>loadAll());
  es.onerror=()=>{$('#pulse').classList.remove('on');es.close();setTimeout(connect,5000);};
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  VIEW=b.dataset.v;
  if(VIEW==='Radar'){ $('#panes').hidden=false; $('#rail').hidden=false; renderGrid(); }
  else { $('#panes').hidden=false; $('#rail').hidden=false; renderOther(); }
});

async function renderOther(){
  const wrap=$('#gridwrap'); $('#panes').classList.remove('open');
  wrap.innerHTML='<div class="empty">loading&hellip;</div>';
  if(VIEW==='Score'){
    const sc=await fetch('/api/scorecard').then(r=>r.json()).catch(()=>null); if(!sc)return;
    wrap.innerHTML=`<div class="note">${sc.totals.predictions} predictions &middot; ${sc.totals.graded} graded &middot;
      ${sc.totals.open} open. Hit rate covers <b>directional calls only</b> — a pass is a decision not to
      participate, not a forecast.</div><table class="g"><thead><tr><th class="l">Agent</th><th class="r">Graded</th>
      <th class="r">Dir</th><th class="r">Hit</th><th class="r">Brier</th><th class="r">Long EV</th>
      <th class="r">vs base</th></tr></thead><tbody>${Object.entries(sc.agents).map(([id,a])=>{
      const vb=sc.vs_baseline[id];
      return `<tr><td class="l">${esc(id)}</td><td class="r">${a.n_graded||0}</td>
        <td class="r">${a.n_directional||0}</td>
        <td class="r">${a.hit_rate==null?'<span class="zero">—</span>':`<span class="${a.hit_rate>=.5?'up':'down'}">${Math.round(a.hit_rate*100)}%</span>`}</td>
        <td class="r">${a.brier==null?'—':a.brier}</td>
        <td class="r">${!a.longs||a.longs.expectancy_pct==null?'—':`<span class="${a.longs.expectancy_pct>0?'up':'down'}">${pc(a.longs.expectancy_pct)}</span>`}</td>
        <td class="r">${vb?(vb.beats_baseline?`<span class="up">+${(vb.hit_rate_delta*100).toFixed(0)}pp</span>`:`<span class="down">${(vb.hit_rate_delta*100).toFixed(0)}pp</span>`):'<span class="zero">bench</span>'}</td></tr>`;
      }).join('')}</tbody></table>`;
  } else if(VIEW==='Tg'){
    const [tg,edge]=await Promise.all([fetch('/api/telegram').then(r=>r.json()).catch(()=>null),
      fetch('/api/edge').then(r=>r.json()).catch(()=>({}))]);
    wrap.innerHTML=`<div class="note">Channels are graded like any other agent. <b>Edge source</b> asks the
      question that matters: were the winning calls made while the tape was already moving (inference,
      followable) or while it was flat (they knew first — you would be exit liquidity)?</div>
      ${tg&&tg.calls&&tg.calls.length?`<table class="g"><thead><tr><th class="l">When</th><th class="l">Channel</th>
      <th class="l">Token</th><th class="c">Call</th><th class="r">Outcome</th><th class="l">Message</th></tr></thead>
      <tbody>${tg.calls.map(c=>`<tr><td class="l">${new Date(c.ts*1000).toLocaleTimeString('en-GB')}</td>
        <td class="l">${esc(c.channel)}</td><td class="l sym">${esc(c.symbol||'?')}</td>
        <td class="c"><span class="pill ${esc(c.call)}">${esc(c.call)}</span></td>
        <td class="r">${c.outcome?`<span class="${c.outcome.return_pct>0?'up':'down'}">${pc(c.outcome.return_pct)}</span>`:'<span class="zero">open</span>'}</td>
        <td class="l nm">${esc((c.text||'').slice(0,90))}</td></tr>`).join('')}</tbody></table>`
      :'<div class="empty">No channel calls logged yet — the five wired channels post news, not calls.</div>'}`;
  } else if(VIEW==='Adapt'){
    const a=await fetch('/api/adapt').then(r=>r.json()).catch(()=>null); if(!a)return;
    wrap.innerHTML=`<div class="note">Spearman rank correlation between each feature at entry and the return
      that followed. A feature is <b>signal</b> only when |IC| clears &plusmn;2/&radic;n.
      ${a.enough_data?'':`<b style="color:var(--warn)">Not enough data: ${a.n_samples}/${a.min_samples} samples.</b>`}</div>
      ${(a.ranked||[]).length?`<table class="g"><thead><tr><th class="l">Feature</th><th class="l">Pillar</th>
      <th class="r">n</th><th class="r">IC</th><th class="c">Verdict</th></tr></thead><tbody>
      ${a.ranked.map(r=>`<tr><td class="l">${esc(r.feature)}</td><td class="l nm">${esc(r.pillar)}</td>
        <td class="r">${r.n}</td><td class="r"><span class="${r.ic>0?'up':'down'}">${r.ic>0?'+':''}${r.ic}</span></td>
        <td class="c">${r.significant?'<span class="up">signal</span>':'<span class="zero">noise</span>'}</td></tr>`).join('')}
      </tbody></table>`:'<div class="empty">No graded samples with feature vectors yet.</div>'}`;
  } else if(VIEW==='Fc'){
    tplName='Forecast'; initTpl(); renderGrid();
  }
}

$('#scan').onclick=async()=>{$('#scan').disabled=true;await fetch('/api/scan',{method:'POST'});};
initTpl(); loadAll(); connect();
</script>
</body>
